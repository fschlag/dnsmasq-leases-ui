<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>dnsmasq-leases-ui</title>
	<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
	<script>
		(() => {
			try {
				const t = localStorage.getItem('dnsmasq-leases-theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch {}
		})();
	</script>
	<style>
		:root {
			--bg: #ffffff;
			--fg: #111111;
			--row-hover: #e6e6e6;
			--muted: #666666;
			--border: #cccccc;
			--accent: #0066cc;
		}
		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) {
				--bg: #1a1a1a;
				--fg: #e6e6e6;
				--row-hover: #2a2a2a;
				--muted: #999999;
				--border: #444444;
				--accent: #4d9fff;
			}
		}
		:root[data-theme="dark"] {
			--bg: #1a1a1a;
			--fg: #e6e6e6;
			--row-hover: #2a2a2a;
			--muted: #999999;
			--border: #444444;
			--accent: #4d9fff;
		}
		#theme-toggle {
			flex: 0 0 auto;
			margin-left: auto;
			background: var(--bg);
			color: var(--fg);
			border: 1px solid var(--fg);
			border-radius: 50%;
			width: 2.25rem;
			height: 2.25rem;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			padding: 0;
		}
		#theme-toggle:hover { background: var(--row-hover); }
		#theme-toggle:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}
		#theme-toggle svg { width: 1.25rem; height: 1.25rem; stroke-width: 2.25; }
		#theme-toggle .icon-moon { fill: var(--fg); stroke: var(--fg); }
		#theme-toggle .icon-sun { stroke: var(--fg); }
		#theme-toggle .icon-sun { display: none; }
		#theme-toggle .icon-moon { display: inline; }
		:root[data-theme="dark"] #theme-toggle .icon-moon { display: none; }
		:root[data-theme="dark"] #theme-toggle .icon-sun { display: inline; }
		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) #theme-toggle .icon-moon { display: none; }
			:root:not([data-theme="light"]) #theme-toggle .icon-sun { display: inline; }
		}
		body {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			background: var(--bg);
			color: var(--fg);
			margin: 1rem;
		}
		table { border-collapse: separate; border-spacing: 0; }
		th, td { text-align: left; padding: 0.4rem 1.5rem 0.4rem 0; }
		tbody tr:hover { background: var(--row-hover); }
		th {
			cursor: pointer;
			user-select: none;
			background: var(--bg);
			position: sticky;
			top: 0;
			z-index: 1;
			box-shadow: inset 0 -1px 0 var(--border);
		}
		th:hover { text-decoration: underline; }
		th:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}
		th.sorted { font-weight: bold; }
		.sort-indicator {
			display: inline-block;
			width: 1em;
			color: var(--muted);
		}
		#status {
			margin-top: 0.5rem;
			color: var(--muted);
			min-height: 1.2em;
		}
		#status.error { color: #cc3333; }
		#footer {
			margin-top: 2rem;
			padding-top: 0.75rem;
			border-top: 1px solid var(--border);
			color: var(--muted);
			font-size: 0.85rem;
		}
		#footer a { color: var(--muted); }
		#footer a:hover { color: var(--accent); }
		#toolbar {
			position: sticky;
			top: 0;
			background: var(--bg);
			padding: 0.5rem 0;
			margin-bottom: 0.25rem;
			z-index: 2;
			display: flex;
			gap: 0.5rem;
			align-items: center;
		}
		#search {
			flex: 1 1 auto;
			min-width: 0;
			max-width: 24rem;
			padding: 0.4rem 0.6rem;
			font: inherit;
			color: var(--fg);
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 4px;
		}
		#search:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 1px;
			border-color: var(--accent);
		}
		th { top: 2.5rem; }
	</style>
</head>
<body data-script-root="{{ request.script_root }}">
<div id="toolbar">
	<input id="search" type="search" placeholder="Filter leases…" aria-label="Filter leases" autocomplete="off">
	<button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
		<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
		</svg>
		<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<circle cx="12" cy="12" r="4"/>
			<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
		</svg>
	</button>
</div>
<table id="leases">
	<thead>
		<tr>
			<th tabindex="0" data-key="ipAddress" aria-sort="ascending">IP Address<span class="sort-indicator"></span></th>
			<th tabindex="0" data-key="macAddress" aria-sort="none">Mac Address<span class="sort-indicator"></span></th>
			<th tabindex="0" data-key="name" aria-sort="none">Name<span class="sort-indicator"></span></th>
			<th tabindex="0" data-key="staticIP" aria-sort="none">DHCP Reservation<span class="sort-indicator"></span></th>
			<th tabindex="0" data-key="leasetime" aria-sort="none">Lease ends on<span class="sort-indicator"></span></th>
		</tr>
	</thead>
	<tbody></tbody>
</table>
<div id="status" role="status" aria-live="polite">Loading…</div>
<footer id="footer">
	<a href="{{ repo_url }}" target="_blank" rel="noopener noreferrer">dnsmasq-leases-ui</a>
	v{{ version }}{% if release_date %} &middot; released {{ release_date }}{% endif %}
</footer>
<!-- Theme-toggle SVGs derived from Feather Icons (MIT). See NOTICE. -->
<script type="module" src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
